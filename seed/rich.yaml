# MCPForge seed — rich exemplar manifests, extracted once from the concept console (W0-A7).
# NOT a manifest. See EXTRACTION_REPORT.md.
- id: "ebs.ap.invoice_hold.release"
  why: "A supplier invoice sits on hold and cannot be paid. Today: raise a ticket, someone opens the Invoice Workbench, finds the hold, judges whether it can go, releases it. This tool is that judgement made explicit, with the release logged and reversible."
  inputs:
    - - "invoice_id"
      - "string · required"
      - "The EBS invoice identifier or number"
    - - "hold_ids"
      - "array of string · optional"
      - "Specific holds to release; omit to release all releasable holds"
    - - "release_reason_code"
      - "enum · required"
      - "Sourced live from the EBS lookup — never a free-text reason"
    - - "dry_run"
      - "boolean · default true"
      - "Validate and report what would happen without changing anything"
  output: "canonical.InvoiceHoldReleaseResult — holds released, holds refused with reasons, resulting invoice status, and a citation block naming the instance, operating unit, timestamp and acting user. Capped at 50 rows."
  security:
    - - "Native privilege"
      - "The acting user must hold the AP_APXINWKB function in the responsibility they are operating under"
    - - "Scope"
      - "ebs.ap.write — granted per deployment, per tool, with recorded approval"
    - - "Org context"
      - "org_id is resolved by the Gateway; an ambiguous context is rejected, never defaulted"
    - - "Read-only mode"
      - "Refuses immediately when the deployment is in read-only mode"
  errors:
    - - "ORA-20001"
      - "Hold cannot be released while the invoice is in an approval workflow."
      - "Check approval state with ebs.po.purchase_order.get_approval_status"
    - - "No releasable holds"
      - "Every hold on this invoice requires a system action, not a manual release."
      - "Use ebs.ap.invoice.get_hold_reasons to see what would clear each one"
    - - "Period closed"
      - "The accounting period for this invoice is closed."
      - "Check with ebs.gl.period.get_status"
  evals:
    - "release the price hold on invoice 88213"
    - "can you clear the holds blocking payment on INV-4471"
    - "why is invoice 88213 blocked — and unblock it if you can"
    - "NEGATIVE: create a new supplier invoice (must not select this tool)"
    - "NEGATIVE: release the PO approval hold in JDE (wrong application)"
- id: "jde.scm.purchase_order.get_receipt_status"
  why: "The single most common buyer question, and a pure read. It is also the tool that proves the JDE approach: an Orchestrator Studio orchestration is already typed, governed and named — so the manifest is mostly a description of something that already exists."
  inputs:
    - - "order_number"
      - "string · required"
      - "JDE order number"
    - - "order_type"
      - "string · default OP"
      - "Document type"
    - - "order_company"
      - "string · optional"
      - "Resolved from user context when omitted"
    - - "include_lines"
      - "boolean · default true"
      - "Return per-line detail as well as the header roll-up"
  output: "canonical.ReceiptStatusResult — ordered, received, open and cancelled quantities per line, an over-receipt flag, the last receipt date, and the header-level verdict: fully receipted, partially receipted, or nothing received. Capped at 200 lines with a summary beyond that."
  security:
    - - "Native privilege"
      - "Per-user AIS token — JDE row security and action security apply exactly as they do in the E1 UI"
    - - "Scope"
      - "jde.scm.read"
    - - "Context"
      - "Business unit and company come from the user's E1 profile, not from the model"
  errors:
    - - "Order not found"
      - "No order matches that number and type in the companies you can see."
      - "Widen with jde.scm.sales_order.search or confirm the document type"
    - - "Orchestration unavailable"
      - "The PO_RECEIPT_STATUS orchestration is not deployed on this AIS server."
      - "Capability probe will disable this tool automatically at install time"
  evals:
    - "has PO 4471 been fully received"
    - "how much of order 4471 is still open"
    - "did we over-receive on any line of 4471"
    - "NEGATIVE: create a receipt for PO 4471 (read tool must not be selected for a write)"
- id: "fusion.erp.ess_job.submit"
  why: "Everything bulk in Fusion is asynchronous. This is the tool that teaches the pattern: submit, then poll, then fetch — three tools, not one, because a tool that blocks for forty minutes is a broken tool."
  inputs:
    - - "job_name"
      - "enum · required"
      - "From a curated allow-list of approved ESS jobs — never an arbitrary job path"
    - - "parameters"
      - "object · required"
      - "Validated against the job's declared parameter schema before submission"
    - - "idempotency_key"
      - "string · auto"
      - "Prevents a retried call from submitting the job twice"
    - - "dry_run"
      - "boolean · default true"
      - "Validate parameters and permissions without submitting"
  output: "canonical.JobSubmission — request id, submitted-by, expected duration band, and the exact follow-up call to poll with. Never returns job output directly."
  security:
    - - "Native privilege"
      - "The user must hold the Fusion privilege the job itself requires; we add nothing"
    - - "Allow-list"
      - "The job must appear in the deployment's approved ESS allow-list. Absent from the list means absent from the catalogue."
    - - "Scope"
      - "fusion.erp.process — a write scope, disabled by default"
  errors:
    - - "Job not in allow-list"
      - "That scheduled process has not been approved for agent submission at this deployment."
      - "Raise it through Business Intake"
    - - "Parameter validation failed"
      - "One or more parameters do not match the job definition."
      - "The error names the offending parameter and its expected form"
  evals:
    - "run the payables invoice validation process for BU 300"
    - "submit the create accounting job for the January period"
    - "NEGATIVE: run any arbitrary ESS job by path (must be refused)"
    - "NEGATIVE: tell me the status of request 88213 (that is get_status)"
- id: "fdi.finance.variance.explain"
  why: "The analytical archetype in one tool. It writes nothing, it reasons over a prebuilt semantic model, and it answers the question an executive actually asks — not \"give me the numbers\" but \"why did it move\"."
  inputs:
    - - "metric"
      - "enum · required"
      - "From the FDI finance metric catalogue — AP spend, DSO, DPO, cost of goods"
    - - "period"
      - "string · required"
      - "Comparison period, e.g. 2026-Q2 vs 2026-Q1"
    - - "dimensions"
      - "array · optional"
      - "Dimensions to decompose across; defaults to the metric's natural drivers"
    - - "top_n"
      - "integer · default 5"
      - "How many contributors to return"
  output: "canonical.VarianceExplanation — total movement, the top contributing dimension members with their signed contribution, coverage percentage, and an explicit statement of what the remainder is. Never more than top_n rows plus a residual."
  security:
    - - "Native privilege"
      - "Row-level security in the FDI semantic model — the user sees exactly the ledgers and business units they see in FDI itself"
    - - "Scope"
      - "fdi.read"
    - - "Data protection"
      - "Aggregate only; the tool cannot return transaction-level detail"
  errors:
    - - "Metric not licensed"
      - "That subject area is not provisioned in this FDI instance."
      - "Use fdi.finance.metric.query to list available metrics"
    - - "Insufficient history"
      - "The comparison period has no loaded data."
      - "Name an earlier period, or check the load with oic.platform.integration.get_status"
  evals:
    - "why is AP spend up versus last quarter"
    - "what is driving the DSO increase in Q2"
    - "break down the cost of goods movement by category"
    - "NEGATIVE: create a journal to correct the variance (analytical tool must not write)"
- id: "oic.platform.integration.get_status"
  why: "The platform archetype — and the reason OIC is the biggest shortcut on the roadmap. Every integration already built is a typed, governed, named endpoint. It is also where the security caveat bites, so it carries a restriction the other tools do not."
  inputs:
    - - "integration_name"
      - "string · required"
      - "Integration identifier or display name"
    - - "window"
      - "string · default 24h"
      - "Time window to report over"
    - - "status_filter"
      - "enum · optional"
      - "all, failed, or in-progress"
    - - "business_identifier"
      - "string · optional"
      - "Trace a single business transaction across instances"
  output: "canonical.IntegrationRunSummary — counts by outcome, the most recent runs with duration, and for failures the fault code plus the first line of fault detail. Never the full payload, which may carry data the user is not entitled to."
  security:
    - - "⚠ The service-account caveat"
      - "OIC integrations typically execute under a service account, so the on-behalf-of identity chain does not reach the underlying application. Until user context is threaded through, OIC-derived tools are restricted to read-only and non-sensitive data."
    - - "Scope"
      - "oic.monitor.read"
    - - "Payload redaction"
      - "Fault payloads are redacted at the Gateway by field-level policy before they ever reach the model"
  errors:
    - - "Integration not found"
      - "No activated integration matches that name."
      - "List them with oic.platform.integration.list"
    - - "Payload withheld"
      - "The fault payload contains fields your policy does not permit."
      - "The fault code and summary are returned; retrieve the payload in OIC directly"
  evals:
    - "did last night's supplier sync run"
    - "how many records failed in the AP integration today"
    - "trace invoice INV-4471 through the integrations"
    - "NEGATIVE: re-run the failed integration (that is a write tool, separately governed)"
- id: "psft.hcm.job_data.update"
  why: "Every PeopleSoft job data change today goes through a HR analyst keying an EFFDT-effective row into Job Data, guessing at which action/reason combination is valid, and hoping the row doesn't collide with a pending pay run. This tool makes the same change through the governed Component Interface — same validation, same edits, none of the interactive UI risk."
  inputs:
    - - "emplid"
      - "string · required"
      - "PeopleSoft employee ID"
    - - "empl_rcd"
      - "integer · required"
      - "Employment record number — a worker can have more than one"
    - - "effdt"
      - "date · required"
      - "Effective date of the change; must not be earlier than the last confirmed pay run for this record"
    - - "action_reason"
      - "enum · required"
      - "Valid PeopleSoft ACTION/REASON pair, e.g. DTA/PRO for a data change promotion"
    - - "field_changes"
      - "object · required"
      - "Only the fields being changed — department, position_nbr, or standard_hours"
  output: "canonical.JobDataUpdateResult — the new effective-dated row number, the fields actually changed after PeopleSoft edits (some derive automatically, e.g. job code from position), and a warning list for anything that will only take effect after the next pay confirm."
  security:
    - - "Native privilege"
      - "PeopleSoft permission list must grant Update access to the JOB_DATA component and the specific row-level department security tree node for this employee"
    - - "Scope"
      - "psft.hcm.write"
    - - "Data protection"
      - "PII — payload logged with emplid only, no SSN/national ID fields ever pass through this tool"
  errors:
    - - "Row-level security denied"
      - "You cannot update employees outside your assigned department tree."
      - "Use psft.hcm.worker.search to confirm which employees are in your security scope"
    - - "Effective date before last confirmed pay run"
      - "This date has already been paid; the change requires a retro request, not a direct update."
      - "Escalate — this tool cannot submit a retro pay adjustment"
    - - "Invalid action/reason for current row"
      - "PeopleSoft rejected this ACTION/REASON combination for the employee's current status."
      - "Call psft.hcm.worker.get to see the current job data row and valid next actions"
  evals:
    - "move employee 8001234 to department 55000 effective next Monday"
    - "change emplid 8004411 record 0 to 37.5 standard hours"
    - "promote this employee with a data change reason"
    - "NEGATIVE: give this employee a pay raise (comp change belongs to a compensation tool, not job data)"
    - "NEGATIVE: backdate the department change to a date already paid (must be blocked and redirected to retro)"
- id: "siebel.service.service_request.create"
  why: "Field and support teams spend real time in Siebel just getting a service request logged correctly — right account, right product, right severity so it routes to the correct queue. This tool is the one governed door for creating an SR from a conversation, with Siebel's own validation still fully in force."
  inputs:
    - - "account_id"
      - "string · required"
      - "Siebel Account Row ID the SR is logged against"
    - - "product"
      - "string · optional"
      - "Product or asset the SR concerns, validated against the account's installed base"
    - - "summary"
      - "string · required"
      - "Short SR description shown in every queue view"
    - - "severity"
      - "enum · required"
      - "1-Critical, 2-High, 3-Medium, 4-Low — drives SLA clock and routing"
    - - "area"
      - "enum · required"
      - "Siebel Area/Sub-Area classification used for skill-based routing"
  output: "canonical.ServiceRequestCreated — the new SR number, assigned owner queue, computed SLA due date, and the entitlement checked to set severity ceiling."
  security:
    - - "Native privilege"
      - "Siebel responsibility must include the Service Request business component with Insert access, scoped to the account's Division"
    - - "Scope"
      - "siebel.service.write"
    - - "Data protection"
      - "internal — account and contact identifiers only; no payment or health data flows through this tool"
  errors:
    - - "Account not in caller's visibility"
      - "You don't have access to log requests against this account."
      - "Use siebel.account.account.get to confirm account ownership and division"
    - - "Severity exceeds entitlement"
      - "This account's support entitlement caps severity at 2-High; Critical requires an entitlement upgrade."
      - "Call siebel.service.entitlement.get to see the account's current coverage"
    - - "Duplicate SR detected"
      - "An open SR already exists for this account and product with a similar summary."
      - "Use siebel.service.service_request.search to review the existing SR before creating a new one"
  evals:
    - "log a high severity SR for Acme Corp about their invoicing module"
    - "open a service request for the printer outage reported by this contact"
    - "create an SR and route it to the network team"
    - "NEGATIVE: close this service request (create tool must not resolve or update an existing SR)"
    - "NEGATIVE: create a Critical SR for an account with only Bronze entitlement without checking coverage first"
- id: "epm.plan.form.update"
  why: "A planner filling in next quarter's forecast today opens a data form, keys numbers cell by cell, and hopes the business rules that validate and aggregate them actually ran. This tool submits a validated payload straight into the Planning cube through the same REST layer the form itself uses — so the aggregation and any auto-calc rules fire exactly as they would from the UI."
  inputs:
    - - "form_id"
      - "string · required"
      - "The target Planning data form"
    - - "pov"
      - "object · required"
      - "Point of view — Scenario, Version, Entity, Year, Period that anchors the write"
    - - "cells"
      - "array · required"
      - "Member-tuple/value pairs for every writable cell being submitted; read-only cells are rejected"
    - - "run_business_rules"
      - "boolean · default true"
      - "Whether to fire the form's attached business rules after the write"
  output: "canonical.PlanningFormWriteResult — cells accepted, cells rejected with the validation reason, and the business rule run ID if rules were triggered."
  security:
    - - "Native privilege"
      - "EPM Cloud role must grant Write access to the form's Planning Unit for the submitted Entity, and the Approval Unit must not already be promoted past the caller's level"
    - - "Scope"
      - "epm.plan.write"
    - - "Data protection"
      - "financial — forecast figures are commercially sensitive; write access is entity-scoped, not global"
  errors:
    - - "Approval unit locked"
      - "This planning unit has already been promoted beyond your review level and can no longer be edited."
      - "Call epm.plan.approval_unit.get_status to see who owns it now"
    - - "Cell is read-only"
      - "One or more submitted cells are calculated members and cannot accept direct input."
      - "Remove those cells and resubmit, or check the form design in epm.plan.form.get"
    - - "Business rule failed"
      - "The attached business rule errored after the write; your numbers were saved but not aggregated."
      - "Use epm.sys.job.get_status to see the rule's failure detail, then re-run it directly"
  evals:
    - "load next quarter's revenue forecast for EMEA into the planning form"
    - "update headcount plan cells for Entity 220 for FY27"
    - "submit these numbers to the marketing forecast form without running the rules yet"
    - "NEGATIVE: change last year's actuals in a Plan scenario form (wrong scenario, must be rejected)"
    - "NEGATIVE: write to a calculated total cell directly"
- id: "hyp.essbase.calc_script.run_process"
  why: "Calc scripts are how Essbase actually turns entered data into consolidated, allocated, currency-translated numbers — and today only a hands-on Hyperion admin knows which script to run, in which order, against which database. This tool exposes one named, pre-approved calc script as a single governed action, so an agent can trigger a consolidation without touching MaxL directly."
  inputs:
    - - "application"
      - "string · required"
      - "Essbase application name"
    - - "database"
      - "string · required"
      - "Cube/database within the application"
    - - "calc_script"
      - "enum · required"
      - "Name of a pre-registered, approved calculation script — arbitrary MaxL is never accepted"
    - - "fix_member"
      - "string · optional"
      - "Optional FIX scope override, e.g. a single entity, to limit the calculation's footprint"
  output: "canonical.CalcRunResult — start/end timestamp, blocks calculated, and a link to the Essbase application log if the script raised a warning."
  security:
    - - "Native privilege"
      - "Essbase Calc access on the target application/database, granted through Hyperion Shared Services provisioning — the same right required to run the script from EAS"
    - - "Scope"
      - "hyp.essbase.write"
    - - "Data protection"
      - "financial — this action changes consolidated figures across every entity in scope, not just the caller's own"
  errors:
    - - "Script not on the approved list"
      - "That calculation script isn't registered for MCP execution."
      - "Ask a Hyperion admin to register it, or use hyp.essbase.cube.list to see what's available"
    - - "Database is locked"
      - "Another calculation or data load is currently running against this database."
      - "Retry after checking hyp.sys job status, or use a narrower fix_member scope"
    - - "Calculation completed with warnings"
      - "The script ran but flagged out-of-balance blocks."
      - "Pull the affected cells with hyp.essbase.data.get before treating the run as clean"
  evals:
    - "run the monthly consolidation calc for the EMEA entity"
    - "recalculate the Plan database after the data load finished"
    - "kick off currency translation for Q3"
    - "NEGATIVE: run an arbitrary MaxL DROP statement (must be refused — not a registered calc script)"
    - "NEGATIVE: run the full consolidation calc scoped to one cost center without the fix_member override, expecting it to only touch that scope"
- id: "ofsc.activity.activity.create"
  why: "Booking a field visit correctly — right work zone, right skill, a time window the customer actually agreed to — is what determines whether a technician shows up prepared or gets redispatched. This tool creates the activity exactly as the OFSC scheduling engine expects, so it enters capacity planning immediately instead of sitting as a mis-routed manual booking."
  inputs:
    - - "customer"
      - "object · required"
      - "Name, address and geocode-able location for the visit"
    - - "work_zone"
      - "string · required"
      - "OFSC work zone the activity should be planned against"
    - - "work_type"
      - "string · required"
      - "Registered work type, which determines required skills and default duration"
    - - "time_window"
      - "object · required"
      - "Requested start/end window the customer agreed to"
    - - "required_skills"
      - "array · optional"
      - "Overrides the work type's default skill requirements if the job needs something extra"
  output: "canonical.ActivityCreated — the new activity ID, its bucket (unscheduled vs. pending route), and the earliest slot the scheduling engine could find if auto-schedule was requested."
  security:
    - - "Native privilege"
      - "OFSC REST API user must hold the Activity Management permission on the target work zone's resource tree"
    - - "Scope"
      - "ofsc.activity.write"
    - - "Data protection"
      - "internal — customer address and contact details are handled as service data, not marketing PII"
  errors:
    - - "Work zone not found"
      - "That work zone isn't configured in this OFSC instance."
      - "Use ofsc.capacity.resource.search filtered by zone to see valid zones"
    - - "No capacity in requested window"
      - "No resource with the required skill has open capacity in this time window."
      - "Call ofsc.capacity.resource.search for nearby windows with available capacity"
    - - "Address could not be geocoded"
      - "The activity was created but could not be placed on the map, so it cannot be auto-scheduled."
      - "Confirm the address and update the activity with ofsc.activity.activity.update"
  evals:
    - "book a technician visit for a broken meter at 44 Elm Street tomorrow morning"
    - "create a field activity for an installation next Tuesday between 9 and 11"
    - "schedule a callback visit for this open case"
    - "NEGATIVE: reschedule an existing activity (this is create, not update)"
    - "NEGATIVE: create an activity with a work type that requires a skill no technician in the zone holds, and expect silent success"
- id: "commerce.oms.return.create"
  why: "A customer service agent handling a return today juggles the storefront order view and a separate returns process to work out what's actually eligible. This tool creates the RMA directly against the order's fulfilled lines, so eligibility, refund method and restocking are all decided against the real order state, not a guess."
  inputs:
    - - "order_id"
      - "string · required"
      - "The Commerce Cloud order the return applies to"
    - - "lines"
      - "array · required"
      - "Order line IDs and quantities being returned"
    - - "reason"
      - "enum · required"
      - "Return reason code — drives whether restocking fee logic applies"
    - - "refund_method"
      - "enum · default original_payment"
      - "original_payment, store_credit, or exchange"
  output: "canonical.ReturnAuthorization — RMA number, expected refund amount per line, and the return shipping label reference if generated."
  security:
    - - "Native privilege"
      - "Commerce Cloud admin user must hold the Order Management functional role with return-authorization permission on the site the order was placed on"
    - - "Scope"
      - "commerce.oms.write"
    - - "Data protection"
      - "internal — order and payment-method reference only; full card numbers are never exposed through this tool"
  errors:
    - - "Line not eligible for return"
      - "This line is outside the site's return window or was already returned."
      - "Check commerce.oms.order.get_status for the line's fulfillment and prior-return history"
    - - "Order not fulfilled yet"
      - "You can't create a return until the order has shipped."
      - "Track fulfillment with commerce.oms.shipment.get_status first"
    - - "Refund method unavailable"
      - "Store credit isn't enabled for this site; choose original_payment or exchange."
      - "Retry with a supported refund_method"
  evals:
    - "the customer wants to return the jacket from order 100234, wrong size"
    - "create a return for two of the three items on this order, refund to store credit"
    - "process a defective-item return and reissue as an exchange"
    - "NEGATIVE: cancel the whole order instead of returning one line (wrong tool)"
    - "NEGATIVE: create a return for an order that hasn't shipped yet"
- id: "oac.analytics.subject_area.explain"
  why: "A business user staring at an OAC subject area list has no idea what grain a subject area is at, which measures are safe to sum, or how it relates to the ones next to it. This tool turns the RPD/semantic model metadata into a plain-language answer, so the next question — build me a report — starts from a correct mental model instead of a guess."
  inputs:
    - - "subject_area"
      - "string · required"
      - "Name of the OAC subject area as shown in the catalogue"
    - - "focus"
      - "enum · optional"
      - "measures, dimensions, or relationships — narrows the explanation; defaults to a full summary"
  output: "canonical.SubjectAreaExplanation — grain statement, the key measures with their aggregation rule (sum/avg/last-value), the common conforming dimensions, and any measures flagged as non-additive."
  security:
    - - "Native privilege"
      - "OAC application role must include Consumer access to the subject area's assigned catalogue folder"
    - - "Scope"
      - "oac.analytics.read"
    - - "Data protection"
      - "internal — metadata only; this tool never returns row-level data, only the model's shape"
  errors:
    - - "Subject area not licensed"
      - "This subject area isn't provisioned for your role."
      - "Use oac.analytics.dataset.search to see subject areas you can access"
    - - "Metadata not published"
      - "The semantic model for this subject area hasn't finished publishing."
      - "Check oac.analytics.data_flow.get_status for the underlying load"
  evals:
    - "what can I actually measure in the Supply Chain subject area"
    - "is revenue in this subject area safe to sum across regions"
    - "explain how the Sales and Finance subject areas relate"
    - "NEGATIVE: pull me the actual revenue numbers for last quarter (that's a query, not an explanation)"
    - "NEGATIVE: explain a subject area name that doesn't exist and expect a fabricated answer instead of a not-found error"
