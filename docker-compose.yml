# MCPForge — W0-K4, the local Docker stack.
#
# One service, matching the single `mcpforge-core` box in 02 §6.6's topology
# diagram: the gateway (MCP endpoint, policy, audit) and — because
# MCPFORGE_MODE defaults to `full` — the portal, spawned as a sibling process
# by the gateway itself (core/gateway/launch.ts). No cloud account, no OCI
# service, no managed database: the SQLite file is a bind-mounted volume, not
# a database container, per 02 §10.1 item 2.
#
# `docker compose up --build` is the whole stack. `pnpm dev` (README /
# CLAUDE.md §3.1) remains the no-Docker path and this file does not touch it.

services:
  mcpforge-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcpforge-core:local
    ports:
      # Gateway MCP endpoint (Streamable HTTP) and the portal (Next.js).
      - '3939:3939'
      - '3000:3000'
    environment:
      MCPFORGE_MODE: ${MCPFORGE_MODE:-full}
      MCPFORGE_GATEWAY_PORT: '3939'
      PORT: '3000'
      # W0-K4: a container has no OS keychain, so the SecretStore's sealing
      # key comes from the environment (05 §4.3.1's env-var path). REQUIRED:
      # compose refuses to start without it rather than inventing one.
      MCPFORGE_SECRETS_KEY: ${MCPFORGE_SECRETS_KEY:?set MCPFORGE_SECRETS_KEY (a long random passphrase) before docker compose up}
    volumes:
      # The ONLY persistent state (02 §10.3: definitions are git, events are
      # the store). W0-K4: the container's OWN directory, not the host's
      # `.mcpforge/`: the host store is sealed with a key held in the host's
      # OS keychain, which a Linux container cannot reach, so sharing it
      # would make the gateway unable to start.
      - ./.mcpforge-docker:/app/.mcpforge
      # The portal's registered consumer key (consumers/portal-local.consumer.yaml
      # names its public half). Read-only; issue a fresh one per deployment
      # with `forge consumer issue-credential` (see DEPLOY.md).
      - ./.mcpforge/portal/portal-local.private.jwk.json:/app/.mcpforge/portal/portal-local.private.jwk.json:ro
    restart: unless-stopped
